#VRML_SIM R2023b utf8
# Mecanum 4-Wheel Omnidirectional Robot
# Features: 4 Mecanum wheels for true omnidirectional movement, 4 distance sensors, GPS, and compass

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/cf743661107268382087198169b17749bc511dd2/projects/robots/kuka/youbot/protos/WheelMesh.proto"
EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/cf743661107268382087198169b17749bc511dd2/projects/robots/kuka/youbot/protos/SubWheelMesh.proto"

PROTO FourWheelRobot [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "mecanum_robot"
  field SFString   controller      "four_wheel_controller"
  field MFString   controllerArgs  []
  field SFString   customData      ""
  field SFBool     supervisor      FALSE
  field SFBool     synchronization TRUE
  field MFNode     extensionSlot   []
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      # Main body (square chassis for Mecanum wheel layout)
      DEF BODY Shape {
        appearance PBRAppearance {
          baseColor 0.2 0.4 0.8
          roughness 0.3
          metalness 0.9
        }
        geometry Box {
          size 0.3 0.3 0.08
        }
      }
      
      # YouBot Exterior Mecanum Wheel (for front-left and rear-right)
      DEF EXTERIOR_WHEEL_SHAPE Transform {
        children [
          WheelMesh {
          }
          Transform {
            rotation 0 0 1 0.7854
            children [
              SubWheelMesh {
              }
            ]
          }
          Transform {
            rotation 0 0 1 -0.7854
            children [
              SubWheelMesh {
              }
            ]
          }
          Transform {
            rotation 0 0 1 2.3562
            children [
              SubWheelMesh {
              }
            ]
          }
          Transform {
            rotation 0 0 1 -2.3562
            children [
              SubWheelMesh {
              }
            ]
          }
        ]
      }
      
      # YouBot Interior Mecanum Wheel (for front-right and rear-left)
      DEF INTERIOR_WHEEL_SHAPE Transform {
        children [
          WheelMesh {
          }
          Transform {
            rotation 0 0 1 -0.7854
            children [
              SubWheelMesh {
              }
            ]
          }
          Transform {
            rotation 0 0 1 0.7854
            children [
              SubWheelMesh {
              }
            ]
          }
          Transform {
            rotation 0 0 1 -2.3562
            children [
              SubWheelMesh {
              }
            ]
          }
          Transform {
            rotation 0 0 1 2.3562
            children [
              SubWheelMesh {
              }
            ]
          }
        ]
      }
      
      # Front Left Mecanum Wheel (Exterior type)
      DEF FRONT_LEFT_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          anchor 0.13 0.13 -0.04
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "front_left_motor"
            maxVelocity 15.0
            maxTorque 12.0
          }
          PositionSensor {
            name "front_left_sensor"
          }
        ]
        endPoint Solid {
          translation 0.13 0.13 -0.04
          children [
            USE EXTERIOR_WHEEL_SHAPE
          ]
          name "front_left_wheel"
          boundingObject Cylinder {
            height 0.072
            radius 0.05
          }
          physics Physics {
            density -1
            mass 0.15
          }
          contactMaterial "ExteriorWheelMat"
        }
      }
      
      # Front Right Mecanum Wheel (Interior type)
      DEF FRONT_RIGHT_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          anchor 0.13 -0.13 -0.04
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "front_right_motor"
            maxVelocity 15.0
            maxTorque 12.0
          }
          PositionSensor {
            name "front_right_sensor"
          }
        ]
        endPoint Solid {
          translation 0.13 -0.13 -0.04
          children [
            USE INTERIOR_WHEEL_SHAPE
          ]
          name "front_right_wheel"
          boundingObject Cylinder {
            height 0.072
            radius 0.05
          }
          physics Physics {
            density -1
            mass 0.15
          }
          contactMaterial "InteriorWheelMat"
        }
      }
      
      # Rear Left Mecanum Wheel (Interior type)
      DEF REAR_LEFT_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          anchor -0.13 0.13 -0.04
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "rear_left_motor"
            maxVelocity 15.0
            maxTorque 12.0
          }
          PositionSensor {
            name "rear_left_sensor"
          }
        ]
        endPoint Solid {
          translation -0.13 0.13 -0.04
          children [
            USE INTERIOR_WHEEL_SHAPE
          ]
          name "rear_left_wheel"
          boundingObject Cylinder {
            height 0.072
            radius 0.05
          }
          physics Physics {
            density -1
            mass 0.15
          }
          contactMaterial "InteriorWheelMat"
        }
      }
      
      # Rear Right Mecanum Wheel (Exterior type)
      DEF REAR_RIGHT_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          anchor -0.13 -0.13 -0.04
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "rear_right_motor"
            maxVelocity 15.0
            maxTorque 12.0
          }
          PositionSensor {
            name "rear_right_sensor"
          }
        ]
        endPoint Solid {
          translation -0.13 -0.13 -0.04
          children [
            USE EXTERIOR_WHEEL_SHAPE
          ]
          name "rear_right_wheel"
          boundingObject Cylinder {
            height 0.072
            radius 0.05
          }
          physics Physics {
            density -1
            mass 0.15
          }
          contactMaterial "ExteriorWheelMat"
        }
      }
      
      # Right distance sensor
      DEF RIGHT_SENSOR DistanceSensor {
        translation 0.16 0 0.02
        rotation 0 0 1 0
        name "right_distance_sensor"
        lookupTable [
          0 0 0
          2 2000 0
        ]
        type "laser"
        aperture 0.05
        numberOfRays 1
      }
      
      # Back distance sensor
      DEF BACK_SENSOR DistanceSensor {
        translation 0 -0.16 0.02
        rotation 0 0 1 -1.5708
        name "back_distance_sensor"
        lookupTable [
          0 0 0
          2 2000 0
        ]
        type "laser"
        aperture 0.05
        numberOfRays 1
      }
      
      # Left distance sensor
      DEF LEFT_SENSOR DistanceSensor {
        translation -0.16 0 0.02
        rotation 0 0 1 3.14159
        name "left_distance_sensor"
        lookupTable [
          0 0 0
          2 2000 0
        ]
        type "laser"
        aperture 0.05
        numberOfRays 1
      }
      
      # Front distance sensor
      DEF FRONT_SENSOR DistanceSensor {
        translation 0 0.16 0.02
        rotation 0 0 1 1.5708
        name "front_distance_sensor"
        lookupTable [
          0 0 0
          2 2000 0
        ]
        type "laser"
        aperture 0.05
        numberOfRays 1
      }
      
      # GPS sensor
      GPS {
        translation 0 0 0.06
        name "gps"
      }
      
      # Compass sensor
      Compass {
        translation 0 0 0.06
        name "compass"
      }
      
      # Extension slot for additional sensors/devices
      Group {
        children IS extensionSlot
      }
    ]
    
    name IS name
    boundingObject USE BODY
    physics Physics {
      density -1
      mass 2.5
      centerOfMass [0 0 0]
    }
  }
}